[project]
name = "comfyui-magik-timeline"
description = "Magik Timeline: a timeline for MiniMax H3 video -- generate a clip, then extend it, prepend to it or bridge between clips seamlessly from their saved latents. The Timeline node is a mini video editor to arrange, cut and preview them, make seamless loops, and upscale the whole sequence in one pass. Ported from comfyui-obvpm-timeline v0.1.4 and extended for dual-resolution pin work."
version = "0.4.0"
license = { file = "LICENSE" }
readme = "README.md"
requires-python = ">=3.9"

# Deliberately empty, as upstream: every third-party import in this pack
# (torch, torchaudio, numpy, safetensors, av) is already in ComfyUI's own
# requirements.txt. Listing them again would let this pack's pins
# contradict core's on someone else's install.
dependencies = []

[project.urls]
# Repository = "https://github.com/magik/magik-timeline"  # set on publish

[tool.comfy]
PublisherId = "magik"
DisplayName = "Magik Timeline"
Icon = ""
# the registry lists this as the supported ComfyUI version (core's Model
# Sparse Attention node, used by the workflow, arrived in 0.35.0)
requires-comfyui = ">=0.35.0"
